    <title>PNW Tour Planner</title>

    <!-- Leaflet CSS & JS -->

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Custom Scrollbar */
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f8fafc; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Map Adjustments */
        .leaflet-popup-content { margin: 12px; }
        .leaflet-container { font-family: inherit; }
        
        /* Smooth transitions */
        .tab-btn { transition: all 0.2s ease-in-out; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen overflow-hidden flex flex-col md:flex-row">

    <!-- Sidebar: Tabs & List -->
    <div class="w-full md:w-[350px] lg:w-[400px] h-[50%] md:h-full bg-white flex flex-col shadow-2xl z-20 relative border-r border-slate-200">
        <!-- Header & Tabs -->
        <div class="bg-white border-b border-slate-100 shrink-0">
            <div class="p-5 pb-3">
                <h1 class="text-2xl font-bold text-slate-800 tracking-tight flex items-center gap-2">
                    <i class="fa-solid fa-map-location-dot text-blue-600"></i> Tour Planner
                </h1>
                <p class="text-sm text-slate-500 mt-1">Explore carefully curated spots</p>
            </div>
            <!-- Tabs -->
            <div class="flex px-4 pb-3 gap-2 overflow-x-auto custom-scroll" id="tabs-container">
                <button onclick="setTab('all')" class="tab-btn active-tab px-4 py-1.5 rounded-full text-xs font-semibold bg-blue-600 text-white shadow-sm whitespace-nowrap" data-tab="all">All</button>
                <button onclick="setTab('gorge')" class="tab-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap" data-tab="gorge">Gorge</button>
                <button onclick="setTab('city')" class="tab-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap" data-tab="city">City (PDX)</button>
                <button onclick="setTab('silverfall')" class="tab-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap" data-tab="silverfall">Silver Fall</button>
            </div>
        </div>

        <!-- Location List -->
        <div id="location-list" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scroll bg-slate-50">
            <!-- JS will populate list here -->
        </div>
    </div>

    <!-- Map Area -->
    <div id="map" class="w-full md:flex-1 h-[50%] md:h-full z-10 relative bg-slate-200"></div>

    <!-- Hover Preview Card (Absolute Positioned via JS) -->
    <div id="preview-card" class="fixed hidden bg-white shadow-2xl rounded-xl overflow-hidden z-[1000] w-72 pointer-events-auto transition-opacity duration-200 ring-1 ring-black/5" style="opacity: 0;">
        <!-- Image Area with Fallback -->
        <div class="h-40 relative flex items-center justify-center overflow-hidden bg-slate-100">
            <img id="preview-img" src="" class="w-full h-full object-cover absolute inset-0 z-10 transition-opacity duration-300">
            <div id="preview-fallback" class="absolute inset-0 z-0 flex items-center justify-center bg-gradient-to-br from-blue-50 to-slate-200 p-4">
                <span id="preview-fallback-text" class="text-slate-600 font-bold text-lg text-center leading-tight drop-shadow-sm"></span>
            </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="p-4 bg-white">
            <h3 id="preview-title" class="font-bold text-slate-800 text-lg mb-1 truncate">Location Name</h3>
            <p id="preview-category" class="text-xs text-slate-500 mb-3 font-bold uppercase tracking-wide">Category</p>
            
            <div class="flex gap-2">
                <a id="preview-btn-map" href="#" target="_blank" class="flex-1 bg-slate-100 text-slate-700 text-center py-2 rounded-lg text-xs font-bold hover:bg-slate-200 transition border border-slate-200 flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-map"></i> Map

                <a id="preview-btn-dir" href="#" target="_blank" class="flex-1 bg-blue-600 text-white text-center py-2 rounded-lg text-xs font-bold hover:bg-blue-700 transition shadow-sm flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-location-arrow"></i> Directions

            </div>
        </div>
    </div>

            { id: 47, name: "Murata Restaurant", img: "murata.jpg", cat: "Food", tabs: ["all", "city"], lat: 45.5160, lng: -122.6781 },
            { id: 48, name: "Creo chocolate", img: "creo_chocolate.jpg", cat: "Food", tabs: ["all", "city"], lat: 45.5348, lng: -122.6565 },
            { id: 49, name: "Otto's Sausage Kitchen", img: "ottos_sausage.jpg", cat: "Food", tabs: ["all", "city"], lat: 45.4851, lng: -122.6033 },
            { id: 50, name: "Eem - Thai BBQ & Cocktails", img: "eem_thai.jpg", cat: "Food", tabs: ["all", "city"], lat: 45.5414, lng: -122.6622 },
            { id: 51, name: "Voodoo Doughnut", img: "voodoo_doughnut.jpg", cat: "Food", tabs: ["all", "city"], lat: 45.5227, lng: -122.6731 },
            { id: 52, name: "Family Cafe", img: "family_cafe.jpg", cat: "Food", tabs: ["all", "city"], lat: 45.5218, lng: -122.6811 } 
        ];

        let currentTab = 'all';
        let map;
        let markers = {};
        let previewTimeout;
        const card = document.getElementById('preview-card');

        // Initialize Map
        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([45.52, -122.67], 10);
            
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap',
                maxZoom: 19
            }).addTo(map);

            L.control.zoom({ position: 'bottomright' }).addTo(map);

            renderData();
            
            // Keep card open if hovering over it directly
            card.addEventListener('mouseenter', () => clearTimeout(previewTimeout));
            card.addEventListener('mouseleave', hidePreview);
        }

        // Tab Switching Logic
        window.setTab = (tabId) => {
            currentTab = tabId;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.dataset.tab === tabId) {
                    btn.classList.add('bg-blue-600', 'text-white', 'shadow-sm');
                    btn.classList.remove('bg-slate-100', 'text-slate-600', 'hover:bg-slate-200');
                } else {
                    btn.classList.remove('bg-blue-600', 'text-white', 'shadow-sm');
                    btn.classList.add('bg-slate-100', 'text-slate-600', 'hover:bg-slate-200');
                }
            });
            renderData();
        };

        // Render List & Map Pins
        function renderData() {
            const listContainer = document.getElementById('location-list');
            listContainer.innerHTML = '';
            
            for (let id in markers) map.removeLayer(markers[id]);
            markers = {};

            const filteredLocs = locations.filter(loc => loc.tabs.includes(currentTab));
            const boundsArray = [];

            filteredLocs.forEach(loc => {
                // 1. Create List Item
                const item = document.createElement('div');
                item.className = "group bg-white p-4 rounded-xl shadow-sm border border-slate-100 hover:shadow-md hover:border-blue-200 transition-all cursor-pointer flex flex-col relative";
                
                let iconClass = "fa-location-dot text-slate-400";
                if (loc.cat.includes("Outdoor")) iconClass = "fa-tree text-green-500";
                if (loc.cat.includes("Food")) iconClass = "fa-utensils text-orange-500";
                if (loc.cat.includes("Coffee")) iconClass = "fa-mug-hot text-amber-700";
                if (loc.cat.includes("Culture")) iconClass = "fa-building-columns text-purple-500";

                item.innerHTML = `
                    <div class="flex items-start justify-between mb-1">
                        <h4 class="font-bold text-slate-800 text-sm group-hover:text-blue-600 transition-colors pr-2">${loc.name}</h4>
                        <i class="fa-solid ${iconClass} mt-0.5 shrink-0"></i>
                    </div>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">${loc.cat}</span>
                `;
                
                // Click to zoom
                item.onclick = () => focusLocation(loc);

                // Hover over List
                item.addEventListener('mouseenter', (e) => {
                    const rect = item.getBoundingClientRect();
                    showPreview(loc, rect.right + 10, rect.top);
                });
                item.addEventListener('mouseleave', hidePreview);

                listContainer.appendChild(item);

                // 2. Create Map Marker
                const marker = L.marker([loc.lat, loc.lng]).addTo(map);
                
                // Click Marker to zoom
                marker.on('click', () => focusLocation(loc));
                
                // Hover over Marker
                marker.on('mouseover', (e) => {
                    showPreview(loc, e.originalEvent.clientX + 15, e.originalEvent.clientY + 15);
                });
                marker.on('mouseout', hidePreview);

                markers[loc.id] = marker;
                boundsArray.push([loc.lat, loc.lng]);
            });

            if (boundsArray.length > 0) map.fitBounds(boundsArray, { padding: [40, 40], maxZoom: 14 });
        }

        // Action: Center map
        function focusLocation(loc) {
            map.flyTo([loc.lat, loc.lng], 15, { duration: 1.5 });
            if (window.innerWidth < 768) {
                document.getElementById('map').scrollIntoView({ behavior: 'smooth' });
            }
        }

        // Preview Card Engine
        function showPreview(loc, x, y) {
            clearTimeout(previewTimeout);
            
            document.getElementById('preview-title').textContent = loc.name;
            document.getElementById('preview-category').textContent = loc.cat;
            
            // MODIFICATION: Use the specific Location Name instead of its coordinates.
            // By URL Encoding the name, Google Maps will search for the specific place profile 
            // instead of just dropping a coordinate pin.
            const placeQuery = encodeURIComponent(loc.name);
            document.getElementById('preview-btn-map').href = `https://www.google.com/maps/search/?api=1&query=${placeQuery}`;
            document.getElementById('preview-btn-dir').href = `https://www.google.com/maps/dir/?api=1&destination=${placeQuery}`;
            
            const imgEl = document.getElementById('preview-img');
            const fallbackTextEl = document.getElementById('preview-fallback-text');
            
            // Image Fallback Logic using new 'img' property, or falling back to the name if missing
            const imageFileName = loc.img ? loc.img : `${loc.name}.jpg`;
            
            imgEl.style.display = 'block'; 
            imgEl.src = `images/${imageFileName}`; 
            imgEl.onerror = () => {
                imgEl.style.display = 'none'; 
                fallbackTextEl.textContent = loc.name; 
            };

            card.classList.remove('hidden');
            
            // Screen boundary protection
            let finalX = x;
            let finalY = y;
            const cardWidth = 288;
            const cardHeight = 310;

            if (finalX + cardWidth > window.innerWidth) finalX = x - cardWidth - 30;
            if (finalY + cardHeight > window.innerHeight) finalY = window.innerHeight - cardHeight - 20;

            card.style.left = `${finalX}px`;
            card.style.top = `${finalY}px`;
            
            setTimeout(() => card.style.opacity = '1', 10);
        }

        function hidePreview() {
            previewTimeout = setTimeout(() => {
                card.style.opacity = '0';
                setTimeout(() => { if(card.style.opacity === '0') card.classList.add('hidden'); }, 200); 
            }, 150); 
        }

        window.onload = initMap;
    </script>
</body>
</html>
